# Single-model B3 service example; not a paper performance experiment.
batch_size_range = [1, 32]
batch_extractor_strategy = { type = "TimeoutProbabilitySplitAndSatisfy", timeout = { secs = 0, nanos = 8000000 }, inner = { threshold = 0.0, inner = {} } }

[init_arrival_rate]
resnet50 = 12.5

[device_combinations.ascend]
type = "Huawei"
config.resource_template = { ai_core = 20, ai_cpu = 7, memory = 64 }
config.share_targets = ["vir05_1c_16g"]

[remote_nodes.ascend]
ip = "127.0.0.1"
port = 9000
template_name = "ascend"
control_timeout_ms = 300000
inference_timeout_ms = 300000
