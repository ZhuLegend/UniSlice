[package]
name = "compute_node"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
cc = "1.0"

[dependencies]
latency_profile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = "0.2"
console-subscriber = { workspace = true, optional = true }

clap = { workspace = true, features = ["derive", "env"] }
uuid = { workspace = true, features = ["v4", "serde"] }
bon = "3.6"
regex = "1.11.1"
pathfinding = "4.14"
rayon = { workspace = true }
dashmap = "6.1"
thiserror = "1.0"
rand = { workspace = true, optional = true }

trait-variant = { workspace = true }

nvml-wrapper = { workspace = true, optional = true }
hw_dcmi_wrapper = { workspace = true, optional = true }
tch = { workspace = true, optional = true }
ort = { workspace = true, optional = true, default-features = false, features = [
    "download-binaries",
    "half",
    "copy-dylibs",
    "load-dynamic",
    "tracing",
] }
file_locking = { version = "0.1.0", optional = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bincode = { workspace = true, features = ["serde"] }

utils = { workspace = true, features = ["clap"] }
comm = { workspace = true }
worker = { workspace = true, features = ["bincode", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ndarray = { workspace = true }
model = { workspace = true }

[features]
console = ["console-subscriber", "tokio/tracing"]
resource_spec = []
vgpu = ["dep:file_locking", "dep:rand"]
bin_help = []

torch = ["dep:tch", "worker/torch"]
onnx = ["dep:ort", "worker/onnx", "worker/half"]
nvidia = ["dep:nvml-wrapper"]
huawei = ["dep:hw_dcmi_wrapper"]

cuda = ["ort?/cuda"]
tensorrt = ["ort?/tensorrt"]
cann = ["ort?/cann"]
coreml = ["ort?/coreml"]

mock = ["dep:latency_profile", "worker/mock", "resource_spec"]
test_utils = []

[[bin]]
name = "nv_vgpu"
path = "src/bin/nv_vgpu/main.rs"
required-features = ["torch", "nvidia", "vgpu", "bin_help"]

[[bin]]
name = "nv_virtual"
path = "src/bin/compute_node/nv_virtual/main.rs"
required-features = ["vgpu", "nvidia", "torch"]

[[bin]]
name = "hw_vgpu"
path = "src/bin/hw_vgpu/main.rs"
required-features = ["onnx", "huawei", "bin_help"]

[[bin]]
name = "hw_virtual"
path = "src/bin/compute_node/hw_virtual/main.rs"
required-features = ["vgpu", "huawei", "onnx"]

[[bin]]
name = "mock_vgpu"
path = "src/bin/mock_vgpu.rs"
required-features = ["vgpu", "mock", "bin_help"]

[[bin]]
name = "mock_virtual"
path = "src/bin/compute_node/mock_virtual.rs"
required-features = ["vgpu", "mock"]
