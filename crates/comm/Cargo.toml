[package]
name = "comm"
edition.workspace = true
version.workspace = true

[dependencies]
bytes = { version = "1", features = ["serde"] }
tokio = { workspace = true, features = ["net", "io-util", "macros", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }

futures = { workspace = true }

snafu = { workspace = true }

bincode = { workspace = true, features = ["serde"] }
tracing = { workspace = true }

utils = { workspace = true }
rand = { workspace = true }

interprocess = { version = "2.0.0", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "serde"] }
get_if_addrs = "0.5.3"

tch = { workspace = true, optional = true }

[dev-dependencies]
model = { workspace = true, features = ["bincode", "serde", "onnx", "half"] }
divan = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[features]
bench = ["tokio/rt-multi-thread"]
torch = ["model/torch", "tch"]

[[bench]]
name = "bench_comm"
harness = false
required-features = ["bench"]
