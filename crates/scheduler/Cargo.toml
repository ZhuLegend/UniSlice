[package]
name = "scheduler"
version = "0.0.1"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
latency_profile = { workspace = true }
trait-variant = "0.1.2"

compute_node = { workspace = true }
worker = { workspace = true, optional = true }
utils = { workspace = true, optional = true }

tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true }
uuid = { workspace = true }
ndarray = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

clap = { workspace = true, optional = true }
indicatif = { version = "0.17.11", optional = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }

tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
console-subscriber = { workspace = true, optional = true }

# Scheduler daemon dependencies
dashmap = { version = "5.5", optional = true }
tempfile = { version = "3.20", optional = true }
toml = { version = "0.8.8", optional = true }
config = { version = "0.14.0", optional = true }
humantime-serde = { version = "1.1.1", optional = true }
base64 = { version = "0.21.5", optional = true }
axum = { version = "0.7", features = ["http2"], optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
hyper = { version = "1.7", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

# Task sender dependencies
chrono = { version = "0.4", features = ["serde"], optional = true }
reqwest = { version = "0.11", features = ["json"], optional = true }
rand_distr = { version = "0.4", optional = true }

pathfinding = { version = "4.14.0" }

[dev-dependencies]
tempfile = "3.20"
tokio = { workspace = true, features = ["test-util"] }
rand = { workspace = true }
rayon = "1.10.0"
divan = { workspace = true }

compute_node = { workspace = true, features = ["test_utils"] }

[features]
console = ["console-subscriber", "tokio/tracing"]
vgpu = ["compute_node/vgpu"]
mock = ["vgpu", "compute_node/mock"]
huawei = ["vgpu", "compute_node/resource_spec"]
nvidia = ["vgpu", "compute_node/resource_spec"]
virtual_compute_node = ["vgpu", "bincode", "serde", "worker", "dashmap", "rand"]
test_utils = ["compute_node/test_utils"]
scheduler_daemon = [
    "utils",
    "virtual_compute_node",
    "dashmap",
    "tempfile",
    "clap",
    "serde",
    "serde_json",
    "toml",
    "config",
    "humantime-serde",
    "base64",
    "tracing",
    "tracing-subscriber",
    "tracing-subscriber/env-filter",
    "tokio/signal",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "rand",
    "axum",
    "hyper",
    "hyper-util",
    "tower",
    "tower-http",
    "bincode",
]
task_sender = [
    "virtual_compute_node",
    "dashmap",
    "clap",
    "serde",
    "serde_json",
    "toml",
    "chrono",
    "reqwest",
    "ndarray",
    "tracing",
    "tracing-subscriber",
    "tracing-subscriber/env-filter",
    "tokio/signal",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "rand",
    "rand_distr",
    "indicatif",
    "tokio-util",
]
[[bench]]
name = "bench_buddy_cell_regroup"
path = "benches/bench_buddy_cell_regroup.rs"
harness = false
required-features = ["virtual_compute_node", "test_utils", ]

[[bench]]
name = "bench_scheduling"
harness = false
required-features = ["virtual_compute_node", "test_utils", "scheduler_daemon"]

[[bin]]
name = "scheduler_daemon"
path = "src/bin/scheduler_daemon/main.rs"
required-features = ["scheduler_daemon"]

[[bin]]
name = "task_sender"
path = "src/bin/task_sender/main.rs"
required-features = ["task_sender"]
