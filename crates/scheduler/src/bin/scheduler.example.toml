# Configuration values are preserved. See the English deployment and experiment guides.
#batch_extractor_strategy = { type = "SplitAndSatisfy" }
# batch_extractor_strategy = { type = "Greedy" }
# batch_extractor_strategy = { type = "Ignored" }
batch_extractor_strategy = { type = "TimeoutSplitAndSatisfy", timeout = { secs = 0, nanos = 8000000 }, inner = { } }
batch_size_range = [1, 32]
[init_arrival_rate]
alexnet = 100.0
efficientnet = 100.0
mnasnet = 100.0
mobilenet = 100.0
resnet18 = 100.0
resnet50 = 100.0
vgg16 = 100.0
vgg19 = 100.0
[device_combinations]
[device_combinations.nvidia_a100]
type = "Nvidia"
config.share_targets = [
    "1g.10gb",
    "2g.20gb",
    "3g.40gb",
    "4g.40gb",
    "7g.80gb"
]
config.resource_template = { ce = 7, memory = 80 }
[device_combinations.nvidia_a100_half]
type = "Nvidia"
config.share_targets = [
    "1g.10gb",
    "2g.20gb",
    "3g.40gb",
]
config.resource_template = { ce = 3, memory = 40 }
